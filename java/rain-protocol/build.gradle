plugins {
    id "java-library"
}

group = "com.rainframework.ui"

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

dependencies {
    // Public types such as ComponentNode and TypeSchema.OptionalType expose JsonNode, so dependents need it too.
    api 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    compileOnly 'org.jspecify:jspecify:1.0.0'
    compileOnly "org.projectlombok:lombok:${lombok_version}"
    annotationProcessor "org.projectlombok:lombok:${lombok_version}"
    testCompileOnly "org.projectlombok:lombok:${lombok_version}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombok_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


repositories {
    mavenCentral()
}

test {
    useJUnitPlatform()
    workingDir = rootProject.projectDir

    // The fixture tests read these at runtime, so Gradle has to know about them or it skips the task as up to date.
    inputs.dir(rootProject.file("schema/fixtures"))
}
