plugins {
    id "java"
}

group = "com.rainframework.ui"

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}


repositories {
    mavenCentral()
}

// Phase A: Test infrastructure exists but isn't run yet (implementations don't exist).
// Phase B will implement the code and enable these tests.
test {
    enabled = false // TODO: Re-enable in Phase B after implementations are added
}
